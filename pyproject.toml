[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doubleadapt-skill"
version = "0.1.0"
description = "DoubleAdapt multi-factor stock return prediction and online adaptation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
authors = [{name = "X-Tech-group", email = "xielinlin@x-tech.net.cn"}]
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=12", "PyYAML>=6.0", "torch>=2.0"]

[project.scripts]
doubleadapt-train = "doubleadapt.cli:train_main"
doubleadapt-infer = "doubleadapt.cli:infer_main"

[tool.setuptools.packages.find]
where = ["src"]
